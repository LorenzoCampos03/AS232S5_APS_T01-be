spring:
  application:
    name: HinoPE
  
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m
      # Validate connections before use to avoid 'Connection validation failed'
      validation-query: SELECT 1
      validation-timeout: 5s
      # Optional: ensure a round-trip validation (uncomment if necesario)
      # validation-depth: remote

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:public/uploads}
    max-size-images: ${FILE_MAX_SIZE_IMAGES:10485760}
    max-size-documents: ${FILE_MAX_SIZE_DOCUMENTS:20971520}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    vg.edu.pe.HinoPE: ${LOG_LEVEL:DEBUG}
    org.springframework.r2dbc: ${LOG_LEVEL_R2DBC:DEBUG}
    io.r2dbc.postgresql.QUERY: ${LOG_LEVEL_QUERY:DEBUG}
    io.r2dbc.postgresql.PARAM: ${LOG_LEVEL_PARAM:DEBUG}
